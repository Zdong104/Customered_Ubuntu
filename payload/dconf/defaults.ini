# Preload desktop defaults (reviewed whitelist).
#
# Source: the owner's `dconf dump /`, filtered by hand to look & feel,
# workspace/dock/tiling, power, touchpad, Files and input settings.
# Deliberately NOT carried over: night-light coordinates, calendar reminders,
# RDP server settings, recents / last-used paths, window geometry, app-picker
# layout, notification per-app entries, workspace-islands saved-state,
# workspace-manage per-connector counts, location services, DND state,
# Chrome PWA favourites, custom keybindings (the P1 Gen 8 one is added by the
# hardware gate as a dconf system-db entry).
#
# Format: [gsettings schema id] then key=GVariant-text. build/gen-override.py
# turns this into 90_preload.gschema.override, emitting every group twice:
# plain and with the ":ubuntu" desktop suffix, because Ubuntu's own
# 10_ubuntu-settings override sets session-specific (":ubuntu") values that
# would otherwise win in the Ubuntu session.

[org.gnome.desktop.interface]
color-scheme='prefer-dark'
enable-hot-corners=true
gtk-theme='Yaru-dark'
icon-theme='Yaru-dark'
show-battery-percentage=true

[org.gnome.desktop.background]
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/rubenslp-Twin_brothers.png'
picture-uri-dark='file:///usr/share/backgrounds/rubenslp-Twin_brothers.png'
primary-color='#000000000000'
secondary-color='#000000000000'

[org.gnome.desktop.screensaver]
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/rubenslp-Twin_brothers.png'
primary-color='#000000000000'
secondary-color='#000000000000'

[org.gnome.desktop.break-reminders.eyesight]
play-sound=true

[org.gnome.desktop.break-reminders.movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=true

[org.gnome.desktop.input-sources]
sources=[('xkb', 'us')]
xkb-options=@as []
per-window=false

[org.gnome.desktop.wm.keybindings]
switch-input-source=@as []
switch-input-source-backward=@as []

[org.gnome.desktop.wm.preferences]
num-workspaces=1

[org.gnome.desktop.peripherals.mouse]
speed=0.23931623931623935

[org.gnome.desktop.peripherals.touchpad]
disable-while-typing-timeout=uint32 1500
speed=0.23931623931623935
tap-to-click=true
two-finger-scrolling-enabled=true

[org.gnome.desktop.privacy]
report-technical-problems=false

[org.gnome.desktop.session]
idle-delay=uint32 0

[org.gnome.settings-daemon.plugins.power]
ambient-enabled=false
idle-dim=false
power-saver-profile-on-low-battery=false
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-timeout=1200
sleep-inactive-battery-type='nothing'

[org.gnome.settings-daemon.plugins.color]
night-light-temperature=uint32 3330

[org.gnome.mutter]
dynamic-workspaces=false
workspaces-only-on-primary=true

[org.gnome.shell]
enabled-extensions=['ding@rastersoft.com', 'tiling-assistant@ubuntu.com', 'cursor-tracker@cua', 'ubuntu-dock@ubuntu.com', 'snapd-search-provider@canonical.com', 'web-search-provider@ubuntu.com', 'workspace-islands@danielbernalo.github.io', 'maximize-own-workspace@zihan.local', 'hide-minimized@zihan.local', 'raise-browser@zihan.local', 'thumbnail-wallpaper@zihan.local', 'dnd-hides-critical@zihan.local', 'workspace-manage@zihan.local', 'titlebar-below-panel@zihan.local', 'no-sticky-claude@zihan.local', 'dock-pull-window@zihan.local', 'emoji-picker@zihan.local', 'ime-cursor-scale@zihan.local', 'notification-banners@zihan.local', 'recent-clipboard-paths@zihan.local', 'shortcut-cheatsheet@zihan.local', 'smart-search@zihan.local']
disabled-extensions=@as []
favorite-apps=['org.gnome.Nautilus.desktop', 'google-chrome.desktop', 'com.microsoft.VSCode.desktop', 'com.anthropic.Claude.desktop', 'org.gnome.Settings.desktop', 'wechat.desktop', 'snap-store_snap-store.desktop', 'org.gnome.Ptyxis.desktop', 'org.gnome.TextEditor.desktop', 'view_view.desktop']

[org.gnome.shell.app-switcher]
current-workspace-only=false

[org.gnome.shell.extensions.dash-to-dock]
dash-max-icon-size=42
isolate-workspaces=false

[org.gnome.shell.extensions.ding]
arrangeorder='NAME'
check-x11wayland=true
icon-size='small'
keep-arranged=false
start-corner='top-right'

[org.gnome.shell.extensions.tiling-assistant]
focus-hint-color='rgb(203,67,20)'
tiling-popup-all-workspace=true

[org.gnome.nautilus.preferences]
default-folder-viewer='list-view'

[org.gnome.nautilus.compression]
default-compression-format='zip'

[org.gnome.nautilus.icon-view]
default-zoom-level='medium'

[org.gnome.nautilus.list-view]
default-zoom-level='medium'

[org.gtk.Settings.FileChooser]
date-format='regular'
location-mode='path-bar'
show-hidden=false
show-size-column=true
show-type-column=true
sort-column='modified'
sort-directories-first=true
sort-order='descending'
type-format='category'

[org.gtk.gtk4.Settings.FileChooser]
date-format='regular'
location-mode='path-bar'
show-hidden=true
sort-column='name'
sort-directories-first=true
sort-order='ascending'
type-format='category'
view-type='list'
