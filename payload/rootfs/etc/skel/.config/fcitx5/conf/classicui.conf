# Keep the horizontal single-row candidate bar (Left/Right walks the row).
Vertical Candidate List=False
# Follow the system dark theme instead of the light "default" theme.
UseDarkTheme=True
Theme=default
DarkTheme=default-dark
# Use the GNOME accent colour for the highlighted candidate.
UseAccentColor=True
# Render the panel at each monitor's own DPI. This machine runs eDP-1 @2x
# alongside two externals @1x, so without this the bar is mis-sized on one of them.
PerScreenDPI=True
EnableFractionalScale=True
WheelForPaging=True
