# Keep the horizontal single-row candidate bar (Left/Right walks the row).
Vertical Candidate List=False
# Follow the system dark theme instead of the light "default" theme.
UseDarkTheme=True
Theme=mac-light
DarkTheme=mac-dark
# macOS-style blue highlight (mac-light / mac-dark themes, installed in
# /usr/share/fcitx5/themes) instead of the GNOME accent colour.
UseAccentColor=False
# Render the panel at each monitor's own DPI. A laptop panel often runs @2x
# alongside externals @1x, so without this the bar is mis-sized on one of them.
PerScreenDPI=True
EnableFractionalScale=True
WheelForPaging=True
