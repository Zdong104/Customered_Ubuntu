# Force fcitx5 as the input method for all toolkits (Qt6 apps such as WeChat
# would otherwise be routed to ibus via QT_IM_MODULES=wayland;ibus).
GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
QT_IM_MODULES=fcitx
XMODIFIERS=@im=fcitx
SDL_IM_MODULE=fcitx

# Run Electron apps on XWayland so the IME uses XIM instead of Wayland
# text-input; fcitx5's Wayland path mispositions the candidate window under
# mixed per-monitor scaling.
ELECTRON_OZONE_PLATFORM_HINT=x11
