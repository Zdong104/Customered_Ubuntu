# preload: fcitx5 is the input method (GTK_IM_MODULE=fcitx, set in
# /etc/environment.d/90-preload-fcitx5.conf), so do not start ibus-daemon.
# Otherwise ibus owns input until fcitx5 starts, then fcitx5 kills it and this
# unit fails on restart. gnome-shell does not spawn its own ibus-daemon while
# this unit exists; it connects to fcitx5's IBus frontend instead.
# A user who switches GTK_IM_MODULE back to ibus gets ibus again.
[Service]
ExecCondition=/bin/sh -c 'case "$$GTK_IM_MODULE" in fcitx*) [ ! -x /usr/bin/fcitx5 ] ;; esac'
