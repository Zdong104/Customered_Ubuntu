# preload-managed: keyd line navigation
# Installed to /etc/keyd/default.conf by preload and replaced on its updates.
# To keep your own edits, delete the first line above: preload then leaves
# this file alone. Source: /usr/local/lib/preload/keyd/default.conf
#
# Mac-style line navigation:
#   Ctrl+Left / Ctrl+Right             -> Home / End        (start/end of line)
#   Ctrl+Shift+Left / Ctrl+Shift+Right -> Shift+Home / End  (select to line edge)
# Ctrl+Home / Ctrl+End (document start/end) are untouched.
# Emergency: Backspace+Escape+Enter together kills keyd and frees the keyboard.
# Apply a change: sudo keyd.rvaiya reload

[ids]
*
# ydotoold virtual device (Vocalinux paste backend) - leave it alone
-2333:6666

[main]

[control]
left = home
right = end

[control+shift]
left = S-home
right = S-end
