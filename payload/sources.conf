# Third-party software for the preload layer. Read by payload/provision.sh.
# Everything is fetched fresh from the vendor at build time.

# --- apt repositories: NAME|KEY-URL|KEYRING-PATH ------------------------------
# The matching source files live in payload/apt-sources/ under the vendors'
# own file names, so vendor postinsts update them in place instead of adding
# duplicates.
# KEY-URL "local:" means: the vendor publishes its key only inside the .deb /
# install script (or only via a keyserver), so the public keyring is taken from
# payload/keys/. onlyoffice-archive-keyring.asc is ONLYOFFICE's repository key
# (keyserver ID CB2DE8E5 in their install guide), fingerprint
# E09C A29F 6E17 8040 EF22  B409 8320 CA65 CB2D E8E5.
REPO|chrome|https://dl.google.com/linux/linux_signing_key.pub|/usr/share/keyrings/google-chrome.gpg
REPO|vscode|https://packages.microsoft.com/keys/microsoft.asc|/usr/share/keyrings/microsoft.gpg
REPO|mozilla|https://packages.mozilla.org/apt/repo-signing-key.gpg|/etc/apt/keyrings/packages.mozilla.org.asc
REPO|claude-desktop|local:claude-desktop-archive-keyring.asc|/usr/share/keyrings/claude-desktop-archive-keyring.asc
REPO|chatgpt|local:chatgpt-archive-keyring.gpg|/usr/share/keyrings/chatgpt-archive-keyring.gpg
REPO|onlyoffice|local:onlyoffice-archive-keyring.asc|/usr/share/keyrings/onlyoffice-archive-keyring.asc

# packages from those repos
APT3P|google-chrome-stable code firefox claude-desktop chatgpt onlyoffice-desktopeditors

# --- vendor .deb downloads: NAME|URL ---------------------------------------
DEB|wechat|https://dldir1v6.qq.com/weixin/Universal/Linux/WeChatLinux_x86_64.deb
DEB|zoom|https://zoom.us/client/latest/zoom_amd64.deb
DEB|cc-switch|github:farion1231/cc-switch:Linux-x86_64.deb

