set timeout=30

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Install Ubuntu (preload) - create your account on first boot" {
    set gfxpayload=keep
    linux  /casper/vmlinuz ds=nocloud\;s=/cdrom/preload/oobe/ --- quiet splash
    initrd /casper/initrd
}
menuentry "Install Ubuntu (preload) - classic installer, create account now" {
    set gfxpayload=keep
    linux  /casper/vmlinuz ds=nocloud\;s=/cdrom/preload/interactive/ --- quiet splash
    initrd /casper/initrd
}
menuentry "Install Ubuntu (preload) - first-boot account, safe graphics" {
    set gfxpayload=keep
    linux  /casper/vmlinuz nomodeset ds=nocloud\;s=/cdrom/preload/oobe/ --- quiet splash
    initrd /casper/initrd
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'Boot from next volume' {
    exit 1
}
menuentry 'UEFI Firmware Settings' {
    fwsetup
}
fi
